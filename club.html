<!DOCTYPE html>
<html lang="en">
<head>
    <title>Campus Club Membership</title>

 <style>
    
        h1 {
            text-align: center;
            color: darkblue;
        }
.topnav {
            background-color: #333;
            overflow: hidden;
        }

        .topnav a {
            float: left;
            color: white;
            text-decoration: none;
            padding: 14px 16px;
        }
         
        .topnav a:hover {
            background-color: #575757;
        }
          
       .card {
            width: 400px;
            margin: 0 auto;
            padding: 15px;
            border: 2px solid black;
            border-radius: 10px;
            background-color: white;
            box-shadow: 4px 4px 8px gray;
            position: relative;
        }

   .card > h2 {
            color: green;
            margin-top: 0;
        }
        .card p {
            font-style: italic;
        } .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: red;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }
    fieldset {
            width: 400px;
            margin: 20px auto;
            padding: 15px;
            border: 1px solid black;
        }
        
        textarea {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
  <body>

    <div class="topnav">
        <a href="#">Home</a>
        <a href="#">Events</a>
        <a href="#">Join</a>
    </div>

   
    <h1>Programming Club</h1>

    <div class="card">
        <span class="badge">NEW</span>
        <h2>About Us</h2>
        <p> Join us to learn coding!</p>
    </div>

    <form action="#" method="post">
        <fieldset>
            <legend>Join the Club</legend>

        
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required minlength="3"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="id">Student ID:</label><br>
            <input type="text" id="id" name="id" required placeholder="24-56693-1" pattern="[0-9]{2}-[0-9]{5}-[0-9]{1}"><br><br>

            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" required min="17" max="40"><br><br>

            <label>Membership Type:</label><br>
            <input type="radio" id="general" name="membership" value="General" required>
            <label for="general">General</label>
            <input type="radio" id="executive" name="membership" value="Executive">
            <label for="executive">Executive</label><br><br>

            <label for="club">Prefer Club:</label><br>
            <select id="club" name="club" required>
                <option value="">Select club</option>
                <option value="Programming">Programming</option>
                <option value="Robotics">Robotics</option>
                <option value="Debate">Debate</option>
            </select><br><br>

            <label for="why">Why do you want to join?</label><br>
            <textarea id="why" name="why" required maxlength="200"></textarea><br><br>

            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">I agree rules</label><br><br>

       
            <input type="submit" value=" Now">

        </fieldset>
    </form>
</body>
</html>
